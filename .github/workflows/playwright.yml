name: Playwright UI Tests (manual)
on:
  workflow_dispatch:
    inputs:
      confirm_public_site_testing:
        description: 'I understand these UI tests interact with an external public demo site'
        required: true
        type: boolean
        default: false
jobs:
  ui:
    if: ${{ inputs.confirm_public_site_testing }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      RUN_PUBLIC_UI: '1'
      AE_TEST_EMAIL: ${{ secrets.AE_TEST_EMAIL }}
      AE_TEST_PASSWORD: ${{ secrets.AE_TEST_PASSWORD }}
      AE_TEST_NAME: ${{ secrets.AE_TEST_NAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config=playwright.config.ts
      - name: Upload Playwright UI report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-ui-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14
