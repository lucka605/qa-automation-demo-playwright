
services:
  postgres:
    image: postgres:17
    container_name: qa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: qa_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: qa_testing
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - qa_postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qa_user -d qa_testing"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  qa_postgres_data:
